# PhishLens API reverse proxy - WBS 5.2.
#
# TLS terminates here. The application listens on 127.0.0.1:8000 only and is
# not reachable from outside the droplet by any other path; this server block
# is the single public entrance.

server {
    listen 80;
    listen [::]:80;
    server_name api.usephishlens.app;

    # Renewal challenges stay on port 80 so certbot can renew without editing
    # this file or stopping nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line, not the 1.25+ `http2 on;` directive:
    # Ubuntu 24.04 ships nginx 1.24, which rejects it as an unknown directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.usephishlens.app;

    ssl_certificate     /etc/letsencrypt/live/api.usephishlens.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.usephishlens.app/privkey.pem;

    # Written out rather than included from certbot's options file: this config
    # is version controlled and should not depend on a file another package
    # happens to drop on the box.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # max_body_html_chars (500k) + max_body_text_chars (200k) plus JSON
    # overhead. Pydantic still bounds every field; this only stops a body too
    # large to be legitimate from reaching the application at all.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    access_log /var/log/nginx/phishlens-access.log;
    error_log  /var/log/nginx/phishlens-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # X-Forwarded-For is what makes the per-IP rate limit on /register mean
        # anything behind a proxy. Without it every request arrives from the
        # proxy and the limit applies to all callers at once.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }
}
