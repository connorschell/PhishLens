# PhishLens API - phase 1 (WBS 5.2).
#
# This file exists only long enough for Let's Encrypt to prove the hostname.
# It serves the ACME challenge over port 80 and nothing else, because at this
# point there is no certificate and the API must not be reachable in the clear.
# Replaced by api.usephishlens.app.conf as soon as the certificate is issued.

server {
    listen 80;
    listen [::]:80;
    server_name api.usephishlens.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
